<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ação Missionária - COMAAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 p-4">

    <div id="app" class="max-w-2xl mx-auto">
        <h1 id="tituloCampanha" class="text-2xl font-black text-amber-500 mb-4">Carregando campanha...</h1>
        <div id="gradeNumeros" class="grid grid-cols-5 gap-2"></div>
        
        <div id="formReserva" class="mt-8 bg-zinc-900 p-6 rounded-xl hidden">
            <h3 class="font-bold mb-4">Reservar números selecionados</h3>
            <input type="text" id="nome" placeholder="Seu Nome" class="w-full bg-zinc-800 p-2 rounded mb-2">
            <input type="text" id="whatsapp" placeholder="Seu WhatsApp" class="w-full bg-zinc-800 p-2 rounded mb-4">
            <button onclick="salvarReserva()" class="w-full bg-green-600 p-3 rounded font-bold">Confirmar Reserva</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwSeJjsgGrdsxZ0Ik4bYRnx8NoSHnwT4KVRzAacZgFdndO8y3nTMQbJCm8i-V_sCrDIHA/exec";
        let campanhaId = new URLSearchParams(window.location.search).get("id");
        let numerosSelecionados = [];

        async function carregarCampanha() {
            if (!campanhaId) return alert("Campanha não encontrada!");
            
            const res = await fetch(`${API_URL}?action=buscarCampanha&id=${campanhaId}`);
            const data = await res.json();
            
            if (data.status === "sucesso") {
                document.getElementById("tituloCampanha").textContent = data.campanha.nome;
                renderizarGrade(data.campanha, data.numerosReservados, data.numerosPagos);
            }
        }

        function renderizarGrade(campanha, reservados, pagos) {
            const container = document.getElementById("gradeNumeros");
            for (let i = 1; i <= campanha.totalNumeros; i++) {
                const btn = document.createElement("button");
                btn.textContent = i;
                btn.className = "p-3 rounded border border-zinc-700 text-sm font-bold";
                
                if (pagos.includes(String(i))) {
                    btn.classList.add("bg-red-900", "text-zinc-500");
                    btn.disabled = true;
                } else if (reservados.includes(String(i))) {
                    btn.classList.add("bg-amber-900", "text-zinc-400");
                    btn.disabled = true;
                } else {
                    btn.classList.add("bg-zinc-800", "hover:bg-zinc-700");
                    btn.onclick = () => alternarSelecao(btn, i);
                }
                container.appendChild(btn);
            }
        }

        function alternarSelecao(btn, num) {
            if (numerosSelecionados.includes(num)) {
                numerosSelecionados = numerosSelecionados.filter(n => n !== num);
                btn.classList.remove("bg-green-600");
            } else {
                numerosSelecionados.push(num);
                btn.classList.add("bg-green-600");
            }
            document.getElementById("formReserva").classList.toggle("hidden", numerosSelecionados.length === 0);
        }

        async function salvarReserva() {
            const nome = document.getElementById("nome").value;
            const zap = document.getElementById("whatsapp").value;
            
            const formData = new URLSearchParams();
            formData.append("action", "salvarReserva");
            formData.append("idCampanha", campanhaId);
            formData.append("comprador", nome);
            formData.append("whatsapp", zap);
            formData.append("numeros", numerosSelecionados.join(","));
            formData.append("total", numerosSelecionados.length * 10); // Ajuste conforme valor da cota

            const res = await fetch(API_URL, { method: "POST", body: formData });
            const data = await res.json();
            
            if (data.status === "sucesso") {
                alert("Reserva feita! Envie o comprovante via Pix.");
                window.location.reload();
            } else {
                alert("Erro: " + data.message);
            }
        }

        carregarCampanha();
    </script>
</body>
</html>
