<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - COMAAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <script>
        // URL da sua Nova Implantação
        const API_URL = "https://script.google.com/macros/s/AKfycbwSeJjsgGrdsxZ0Ik4bYRnx8NoSHnwT4KVRzAacZgFdndO8y3nTMQbJCm8i-V_sCrDIHA/exec";
        let campanhaSelecionadaId = "";
        const MASTER_PASSWORD = "Comaan123"; 
    </script>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800">
            <select id="selectCampanhas" onchange="selecionarCampanha(this.value)" class="w-full bg-zinc-950 p-4 rounded-xl border border-zinc-800">
                <option value="">-- Selecione uma Ação Missionária --</option>
            </select>

            <div id="boxLinkCampanha" class="hidden mt-4 p-4 bg-zinc-950 rounded-xl border border-zinc-800">
                <p class="text-xs text-zinc-500 uppercase font-bold">Link da Campanha:</p>
                <code id="linkPublicoTxt" class="text-amber-400 break-all text-sm"></code>
            </div>
        </section>
    </main>

    <script>
        function selecionarCampanha(id) {
            campanhaSelecionadaId = id;
            const boxLink = document.getElementById("boxLinkCampanha");
            const linkTxt = document.getElementById("linkPublicoTxt");
            
            if (!id) {
                boxLink.classList.add("hidden");
                return;
            }

            // CORREÇÃO: Força o link para o arquivo na pasta arrecadacao
            const currentUrl = window.location.href; // Ex: .../arrecadacao/adm.html
            const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/'));
            
            // O link aponta para o index.html (ou publico.html) na mesma pasta do adm
            linkTxt.textContent = `${baseUrl}/index.html?id=${id}`;
            boxLink.classList.remove("hidden");

            carregarReservasDaCampanha(id);
        }

        function carregarReservasDaCampanha(idCampanha) {
            // Adicionado log para verificar se a API está sendo chamada
            console.log("Buscando reservas em: " + API_URL + "?action=listarReservas&id=" + idCampanha);
            
            fetch(`${API_URL}?action=listarReservas&id=${idCampanha}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "sucesso") {
                        // ... (renderização da tabela)
                        console.log("Reservas carregadas:", data.reservas);
                    } else {
                        alert("Erro: " + data.message);
                    }
                })
                .catch(err => {
                    console.error("Erro de conexão:", err);
                    alert("Erro ao conectar com a planilha. Verifique o console (F12).");
                });
        }
        
        // ... (restante das suas funções)
    </script>
</body>
</html>
