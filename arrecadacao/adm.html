<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - COMAAN+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gold-shine {
            background: linear-gradient(135deg, #FFE066 0%, #F5B041 50%, #B7950B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(245, 176, 65, 0.4);
        }
        .comaan-yellow { color: #F5B041; }
        .plus-symbol { color: #F5B041; font-weight: 900; }
        
        /* Estilos para Tabela Responsiva em Mobile */
        @media (max-width: 768px) {
            .mobile-card-list { display: block; }
            .desktop-table { display: none; }
        }
        @media (min-width: 769px) {
            .mobile-card-list { display: none; }
            .desktop-table { display: table; }
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans flex flex-col justify-between">

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwSeJjsgGrdsxZ0Ik4bYRnx8NoSHnwT4KVRzAacZgFdndO8y3nTMQbJCm8i-V_sCrDIHA/exec";
        let campanhaSelecionadaId = "";
        let listaReservasAtual = []; 
        const MASTER_PASSWORD = "Comaan123"; 
    </script>

    <!-- TELA DE LOGIN -->
    <div id="telaLogin" class="fixed inset-0 bg-zinc-950 flex items-center justify-center z-[100] px-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 max-w-md w-full text-center shadow-2xl space-y-6">
            <div class="flex flex-col items-center gap-2">
                <i class="fa-solid fa-lock text-4xl mb-2 text-zinc-600"></i>
                <h2 class="text-2xl font-black uppercase tracking-tight text-white">COMAAN<span class="plus-symbol text-3xl">+</span></h2>
                <p class="text-zinc-400 text-xs tracking-wide uppercase font-bold">Acesso Administrativo</p>
            </div>
            <form onsubmit="verificarSenha(event)" class="space-y-4">
                <input type="password" id="senhaInput" required placeholder="Digite a senha" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3.5 text-center text-zinc-100 placeholder-zinc-600 font-bold focus:outline-none focus:border-amber-500 transition-all tracking-widest text-lg">
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-black py-3.5 px-4 rounded-xl transition-all shadow-lg cursor-pointer">
                    Entrar no Painel
                </button>
                <div id="erroSenha" class="text-red-500 text-xs font-bold hidden">Senha incorreta!</div>
            </form>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="conteudoPainel" class="hidden flex-col min-h-screen w-full">
        
        <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-extrabold uppercase tracking-tight text-white">
                        COMAAN<span class="plus-symbol text-3xl">+</span>
                    </h1>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="carregarCampanhas()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 p-2.5 rounded-xl transition-all cursor-pointer" title="Atualizar">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                    <button onclick="fazerLogout()" class="bg-red-900/20 text-red-400 p-2.5 rounded-xl transition-all cursor-pointer">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6 w-full flex-grow">
            
            <!-- FORMULÁRIO DE CRIAÇÃO -->
            <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-xl h-fit">
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-plus text-amber-500"></i> Nova Campanha
                </h2>
                <form id="formCriarCampanha" onsubmit="criarCampanha(event)" class="space-y-4">
                    <input type="text" id="nomeAcao" required placeholder="Nome da Ação" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 focus:border-amber-500 outline-none">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="quantidadeNumeros" required placeholder="Qtd Números" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none">
                        <input type="number" id="valorCota" step="0.01" required placeholder="Valor R$" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none">
                    </div>
                    <textarea id="descricaoPremios" rows="2" required placeholder="Prêmios (um por linha)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none"></textarea>
                    <textarea id="obsCampanha" rows="2" placeholder="Promoções / Observações" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none"></textarea>
                    <button type="submit" id="btnSalvarCampanha" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-black py-3.5 rounded-xl transition-all cursor-pointer">
                        Criar Campanha
                    </button>
                </form>
            </section>

            <!-- GESTÃO DE RESERVAS -->
            <section class="lg:col-span-2 space-y-6">
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-xl">
                    <label class="block text-xs font-bold text-zinc-500 uppercase mb-2">Campanha Ativa</label>
                    <select id="selectCampanhas" onchange="selecionarCampanha(this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 font-bold outline-none cursor-pointer">
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-xl min-h-[400px]">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-emerald-500"></i> Reservas Agrupadas
                        </h2>
                        <span id="contadorReservas" class="text-[10px] bg-zinc-950 px-2 py-1 rounded-lg border border-zinc-800 text-zinc-500 font-bold uppercase">0 Pedidos</span>
                    </div>

                    <div id="resumoOcioso" class="text-center py-20 text-zinc-600">
                        <i class="fa-solid fa-inbox text-4xl mb-3 opacity-20"></i>
                        <p class="text-sm">Selecione uma campanha para ver os pedidos.</p>
                    </div>

                    <!-- TABELA DESKTOP -->
                    <div class="overflow-x-auto rounded-xl border border-zinc-800 hidden" id="tabelaReservasContainer">
                        <table class="w-full text-left desktop-table">
                            <thead class="bg-zinc-950 text-[10px] font-bold uppercase text-zinc-500 border-b border-zinc-800">
                                <tr>
                                    <th class="p-4">Comprador</th>
                                    <th class="p-4">Números</th>
                                    <th class="p-4">Valor</th>
                                    <th class="p-4 text-center">Status</th>
                                    <th class="p-4 text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="listaReservasCorpo" class="text-sm divide-y divide-zinc-800"></tbody>
                        </table>

                        <!-- LISTA CARDS MOBILE -->
                        <div id="listaReservasCards" class="mobile-card-list space-y-4 p-2"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        function verificarSenha(e) {
            e.preventDefault();
            if(document.getElementById("senhaInput").value === MASTER_PASSWORD) {
                document.getElementById("telaLogin").classList.add("hidden");
                document.getElementById("conteudoPainel").classList.remove("hidden");
                carregarCampanhas();
            } else {
                document.getElementById("erroSenha").classList.remove("hidden");
            }
        }

        function fazerLogout() { location.reload(); }

        async function carregarCampanhas() {
            const sel = document.getElementById("selectCampanhas");
            sel.innerHTML = "<option>Carregando...</option>";
            try {
                const res = await fetch(`${API_URL}?action=listarcampanhas`);
                const json = await res.json();
                sel.innerHTML = '<option value="">-- Selecione uma Campanha --</option>';
                json.campanhas.forEach(c => {
                    sel.innerHTML += `<option value="${c.id}">${c.nome} (${c.totalNumeros} nºs) - [${c.status}]</option>`;
                });
            } catch(e) { alert("Erro ao carregar campanhas."); }
        }

        async function selecionarCampanha(id) {
            if(!id) return;
            campanhaSelecionadaId = id;
            document.getElementById("resumoOcioso").classList.add("hidden");
            document.getElementById("tabelaReservasContainer").classList.remove("hidden");
            atualizarListaReservas();
        }

        async function atualizarListaReservas() {
            const corpo = document.getElementById("listaReservasCorpo");
            const cards = document.getElementById("listaReservasCards");
            corpo.innerHTML = "<tr><td colspan='5' class='p-10 text-center'>Buscando reservas...</td></tr>";
            cards.innerHTML = "<p class='text-center py-10'>Buscando...</p>";

            try {
                const res = await fetch(`${API_URL}?action=listarreservas&id=${campanhaSelecionadaId}`);
                const json = await res.json();
                corpo.innerHTML = "";
                cards.innerHTML = "";
                
                document.getElementById("contadorReservas").innerText = `${json.reservas.length} Pedidos`;

                json.reservas.forEach(r => {
                    const statusClass = r.statusPagamento === "Aprovado" ? "text-emerald-500 bg-emerald-500/10" : "text-amber-500 bg-amber-500/10";
                    
                    // LINHA TABELA (DESKTOP)
                    corpo.innerHTML += `
                        <tr class="hover:bg-zinc-800/30 transition-all">
                            <td class="p-4 font-bold text-white">${r.comprador}<br><span class="text-[10px] text-zinc-500">${r.whatsapp}</span></td>
                            <td class="p-4 font-mono text-xs text-amber-400">${r.numeros}</td>
                            <td class="p-4 font-bold">R$ ${r.total.toFixed(2)}</td>
                            <td class="p-4 text-center"><span class="px-2 py-1 rounded-md text-[10px] font-bold uppercase ${statusClass}">${r.statusPagamento}</span></td>
                            <td class="p-4 text-right flex justify-end gap-2">
                                ${r.statusPagamento !== 'Aprovado' ? `<button onclick="alterarStatus('${r.idReserva}', 'Aprovado')" class="bg-emerald-600 p-2 rounded-lg text-white hover:bg-emerald-500 transition-all cursor-pointer"><i class="fa-solid fa-check"></i></button>` : ''}
                                <button onclick="alterarStatus('${r.idReserva}', 'Cancelado')" class="bg-red-900/40 p-2 rounded-lg text-red-400 hover:bg-red-800/40 transition-all cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
                            </td>
                        </tr>
                    `;

                    // CARD (MOBILE)
                    cards.innerHTML += `
                        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 space-y-3 shadow-md">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-black text-white text-base">${r.comprador}</h3>
                                    <p class="text-xs text-zinc-500">${r.whatsapp}</p>
                                </div>
                                <span class="px-2 py-1 rounded-md text-[9px] font-black uppercase ${statusClass}">${r.statusPagamento}</span>
                            </div>
                            <div class="bg-zinc-900/50 p-2 rounded-lg">
                                <p class="text-[10px] text-zinc-500 uppercase font-bold mb-1">Números:</p>
                                <p class="text-amber-400 font-mono text-xs break-words">${r.numeros}</p>
                            </div>
                            <div class="flex justify-between items-center">
                                <p class="font-black text-lg text-white">R$ ${r.total.toFixed(2)}</p>
                                <div class="flex gap-2">
                                    ${r.statusPagamento !== 'Aprovado' ? `<button onclick="alterarStatus('${r.idReserva}', 'Aprovado')" class="bg-emerald-600 px-4 py-2 rounded-xl text-white font-bold text-sm transition-all active:scale-95 cursor-pointer">Aprovar</button>` : ''}
                                    <button onclick="alterarStatus('${r.idReserva}', 'Cancelado')" class="bg-red-900/40 px-3 py-2 rounded-xl text-red-400 font-bold text-sm transition-all active:scale-95 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch(e) { corpo.innerHTML = "<tr><td colspan='5' class='p-10 text-center text-red-500'>Erro ao carregar dados.</td></tr>"; }
        }

        async function alterarStatus(id, novoStatus) {
            if(!confirm(`Deseja marcar este pedido como ${novoStatus.toUpperCase()}?`)) return;
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "atualizarstatuspagamento", idReserva: id, novoStatus: novoStatus, idCampanha: campanhaSelecionadaId })
                });
                const json = await res.json();
                if(json.status === "sucesso") { atualizarListaReservas(); } else { alert("Erro: " + json.message); }
            } catch(e) { alert("Erro de conexão."); }
        }

        async function criarCampanha(e) {
            e.preventDefault();
            const btn = document.getElementById("btnSalvarCampanha");
            btn.disabled = true;
            btn.innerText = "Criando...";
            const payload = {
                action: "criarcampanha",
                nome: document.getElementById("nomeAcao").value,
                totalNumeros: document.getElementById("quantidadeNumeros").value,
                valorCota: document.getElementById("valorCota").value,
                descricaoPremios: document.getElementById("descricaoPremios").value,
                obsCampanha: document.getElementById("obsCampanha").value
            };
            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                const json = await res.json();
                if(json.status === "sucesso") { alert("Campanha criada!"); location.reload(); } else { alert("Erro: " + json.message); }
            } catch(e) { alert("Erro de conexão."); }
            btn.disabled = false;
        }
    </script>
</body>
</html>
