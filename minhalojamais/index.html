<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtuosas Brechó + - Catálogo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
    
    body { margin:0; font-family:'Inter',sans-serif; background:#f8f9fa; color:#333; }
    header {
      background:#0A1428; color:white; padding:15px 20px; position:sticky; top:0; z-index:100;
    }
    .header-content { max-width:1280px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .logo { font-family:'Playfair Display',serif; font-size:26px; }
    .logo .plus { color:#D4AF37; }
    .client-name { font-size:22px; font-weight:600; color:#D4AF37; }

    .search-bar {
      flex:1; max-width:500px; padding:12px 20px; background:white; border:1px solid #ddd; border-radius:50px;
    }

    .categories { background:white; padding:12px 20px; border-bottom:1px solid #eee; overflow-x:auto; white-space:nowrap; }
    .cat-btn {
      display:inline-block; padding:8px 18px; margin-right:10px; background:#f1f1f1; border-radius:30px; cursor:pointer;
    }
    .cat-btn.active, .cat-btn:hover { background:#0A1428; color:white; }

    .product-grid {
      max-width:1280px; margin:30px auto; padding:20px;
      display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:24px;
    }
    .product-card {
      background:white; border-radius:16px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.08);
      display:flex;
    }
    .product-image { width:50%; height:240px; object-fit:cover; }
    .product-info { width:50%; padding:15px; }
    .product-name { font-size:16px; font-weight:600; margin:0 0 8px 0; }
    .price { color:#D4AF37; font-size:19px; font-weight:700; }
    .promo-price { text-decoration:line-through; color:#999; font-size:14px; }

    .floating-cart {
      position:fixed; bottom:25px; right:25px; background:#0A1428; color:white;
      width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:30px; box-shadow:0 8px 25px rgba(10,20,40,0.4); z-index:300; cursor:pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div>
        <div class="logo">EU<span class="plus">+</span> NEGÓCIO</div>
        <div class="client-name">Virtuosas Brechó +</div>
      </div>
      <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Buscar..." onkeyup="filterProducts()">
    </div>
  </header>

  <div class="categories">
    <span class="cat-btn active" onclick="filterCategory('all')">Todos</span>
    <span class="cat-btn" onclick="filterCategory('Feminino')">Feminino</span>
    <span class="cat-btn" onclick="filterCategory('Calçados')">Calçados</span>
    <span class="cat-btn" onclick="filterCategory('Infantil')">Infantil</span>
  </div>

  <div class="product-grid" id="productGrid"></div>

  <div class="floating-cart" onclick="showCart()">🛒 <span id="cart-count">0</span></div>

  <script>
    console.log("🚀 Script iniciado");

    const products = [];
    for (let i = 1; i <= 50; i++) {
      products.push({
        id: i,
        name: `Blusa ${i} - Feminina ${['Preta','Branca','Vermelha'][i%3]}`,
        category: i % 2 === 0 ? 'Feminino' : 'Calçados',
        price: 30 + (i % 70),
        size: ['P','M','G','34'][i%4],
        img: `https://picsum.photos/id/${i+40}/600/600`
      });
    }

    function renderProducts(filtered) {
      console.log("Renderizando", filtered.length, "produtos");
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.img}" class="product-image">
          <div class="product-info">
            <h3 class="product-name">${p.name}</h3>
            <p>Tam: ${p.size}</p>
            <p class="price">R$ ${p.price},00</p>
            <button onclick="addToCart(${p.id}); event.stopImmediatePropagation()" style="margin-top:12px;width:100%;padding:13px;background:#0A1428;color:white;border:none;border-radius:8px;">Adicionar</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    let cart = [];
    function addToCart(id) {
      cart.push(products.find(p => p.id === id));
      document.getElementById('cart-count').textContent = cart.length;
    }

    function showCart() {
      alert(`Carrinho tem ${cart.length} produtos`);
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
      renderProducts(filtered);
    }

    function filterProducts() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(term));
      renderProducts(filtered);
    }

    // Força o carregamento
    document.addEventListener('DOMContentLoaded', () => {
      console.log("DOM carregado - Renderizando produtos...");
      renderProducts(products);
    });
  </script>
</body>
</html>
