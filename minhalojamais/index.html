<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtuosas Brechó + - Catálogo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
    
    body { 
      margin:0; 
      font-family:'Inter',sans-serif; 
      background:#f8f9fa; 
      color:#333; 
    }
    header {
      background:#0A1428; 
      color:white; 
      padding:15px 20px; 
      position:sticky; 
      top:0; 
      z-index:100;
    }
    .header-content { 
      max-width:1280px; 
      margin:0 auto; 
      display:flex; 
      justify-content:space-between; 
      align-items:center; 
      flex-wrap:wrap; 
      gap:10px; 
    }
    .logo { font-family:'Playfair Display',serif; font-size:26px; }
    .logo .plus { color:#D4AF37; }
    .client-name { font-size:22px; font-weight:600; color:#D4AF37; }

    .search-bar {
      flex:1; 
      max-width:500px; 
      padding:12px 20px; 
      background:white; 
      border:1px solid #ddd; 
      border-radius:50px;
    }

    .categories { 
      background:white; 
      padding:12px 20px; 
      border-bottom:1px solid #eee; 
      overflow-x:auto; 
      white-space:nowrap; 
    }
    .cat-btn {
      display:inline-block; 
      padding:8px 18px; 
      margin-right:10px; 
      background:#f1f1f1; 
      border-radius:30px; 
      cursor:pointer;
    }
    .cat-btn.active, .cat-btn:hover { 
      background:#0A1428; 
      color:white; 
    }

    .product-grid {
      max-width:1280px; 
      margin:30px auto; 
      padding:20px;
      display:grid; 
      grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); 
      gap:24px;
    }
    .product-card {
      background:white; 
      border-radius:16px; 
      overflow:hidden; 
      box-shadow:0 4px 15px rgba(0,0,0,0.08);
      display:flex;
    }
    .product-image { width:50%; height:240px; object-fit:cover; }
    .product-info { width:50%; padding:15px; }
    .product-name { font-size:16px; font-weight:600; margin:0 0 8px 0; }
    .price { color:#D4AF37; font-size:19px; font-weight:700; }

    .floating-cart {
      position:fixed; 
      bottom:25px; 
      right:25px; 
      background:#0A1428; 
      color:white;
      width:70px; 
      height:70px; 
      border-radius:50%; 
      display:flex; 
      align-items:center; 
      justify-content:center;
      font-size:30px; 
      box-shadow:0 8px 25px rgba(10,20,40,0.4); 
      z-index:300; 
      cursor:pointer;
    }

    /* Modal Carrinho */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 400;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      width: 90%;
      max-width: 500px;
      border-radius: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }
    footer {
      background: #0A1428;
      color: #D4AF37;
      text-align: center;
      padding: 25px 20px;
      margin-top: 60px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div>
        <div class="logo">EU<span class="plus">+</span> NEGÓCIO</div>
        <div class="client-name">Virtuosas Brechó +</div>
      </div>
      <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Buscar..." onkeyup="filterProducts()">
    </div>
  </header>

  <div class="categories">
    <span class="cat-btn active" onclick="filterCategory('all')">Todos</span>
    <span class="cat-btn" onclick="filterCategory('Feminino')">Feminino</span>
    <span class="cat-btn" onclick="filterCategory('Calçados')">Calçados</span>
    <span class="cat-btn" onclick="filterCategory('Infantil')">Infantil</span>
  </div>

  <div class="product-grid" id="productGrid"></div>

  <div class="floating-cart" onclick="showCartModal()">
    🛒 <span id="cart-count" style="position:absolute;top:-8px;right:-8px;background:#D4AF37;color:#000;font-size:16px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;">0</span>
  </div>

  <!-- Modal do Carrinho -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <div style="padding:20px; border-bottom:1px solid #ddd; display:flex; justify-content:space-between;">
        <h2>Seu Pedido</h2>
        <span onclick="closeCartModal()" style="font-size:28px; cursor:pointer;">✕</span>
      </div>
      <div id="cartItems" style="padding:20px;"></div>
      <div style="padding:20px; background:#f8f9fa; text-align:center;">
        <h3>Total: <span id="cartTotal" style="color:#D4AF37;"></span></h3>
        <button onclick="finalizeOrder()" style="width:100%; padding:18px; background:#0A1428; color:white; border:none; border-radius:12px; font-size:18px; margin-top:15px;">
          Finalizar e Enviar via WhatsApp
        </button>
      </div>
    </div>
  </div>

  <footer>
    Virtuosas Brechó + • Rua Chaves Barcelos, 278 - São Luís<br>
    (51) 98226-4855 • @virtuosasbrecho<br>
    Powered by EU+ Negócio
  </footer>

  <script>
    const products = [];
    for (let i = 1; i <= 50; i++) {
      products.push({
        id: i,
        name: `Produto ${i} - ${['Blusa Feminina', 'Bota Preta', 'Calça Jeans', 'Vestido Floral'][i%4]}`,
        category: ['Feminino', 'Calçados', 'Infantil'][i%3],
        price: 35 + (i % 85),
        size: ['P','M','G','34','36'][i%5],
        img: `https://picsum.photos/id/${i+30}/600/600`
      });
    }

    let cart = [];

    function renderProducts(filtered) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.img}" class="product-image">
          <div class="product-info">
            <h3 class="product-name">${p.name}</h3>
            <p>Tam: ${p.size}</p>
            <p class="price">R$ ${p.price},00</p>
            <button onclick="addToCart(${p.id}); event.stopImmediatePropagation()" style="margin-top:15px; width:100%; padding:14px; background:#0A1428; color:white; border:none; border-radius:8px; font-weight:600;">Adicionar ao Carrinho</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      cart.push(item);
      document.getElementById('cart-count').textContent = cart.length;
    }

    function showCartModal() {
      if (cart.length === 0) {
        alert("Seu carrinho está vazio!");
        return;
      }
      let html = '';
      let total = 0;
      cart.forEach(item => {
        total += item.price;
        html += `<div style="display:flex;justify-content:space-between;margin:15px 0;padding-bottom:12px;border-bottom:1px solid #eee;">
                   <div>${item.name}<br><small>Tam: ${item.size}</small></div>
                   <div style="color:#D4AF37;font-weight:700;">R$ ${item.price},00</div>
                 </div>`;
      });
      document.getElementById('cartItems').innerHTML = html;
      document.getElementById('cartTotal').innerHTML = `R$ ${total},00`;
      document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCartModal() {
      document.getElementById('cartModal').style.display = 'none';
    }

    function finalizeOrder() {
      let msg = "Olá Virtuosas Brechó! Gostaria de comprar:\n\n";
      let total = 0;
      cart.forEach(item => {
        msg += `- ${item.name} (Tam: \( {item.size}) - R \) ${item.price},00\n`;
        total += item.price;
      });
      msg += `\nTotal: R$ ${total},00`;
      window.open(`https://wa.me/51982264855?text=${encodeURIComponent(msg)}`);
      closeCartModal();
      cart = [];
      document.getElementById('cart-count').textContent = 0;
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
      renderProducts(filtered);
    }

    function filterProducts() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(term));
      renderProducts(filtered);
    }

    // Carregar produtos
    document.addEventListener('DOMContentLoaded', () => {
      renderProducts(products);
    });
  </script>
</body>
</html>
