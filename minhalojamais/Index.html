<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja + - Catálogo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
    
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #05080F;
      color: #fff;
    }
    header {
      background: rgba(10, 20, 40, 0.95);
      padding: 15px 20px;
      border-bottom: 1px solid #D4AF37;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #fff;
    }
    .logo .plus { color: #D4AF37; }
    .search-bar {
      flex: 1;
      max-width: 500px;
      margin: 0 20px;
      padding: 12px 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid #D4AF37;
      border-radius: 50px;
      color: #fff;
    }

    .filters {
      background: #0A1428;
      padding: 12px 20px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .product-grid {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }
    .product-card {
      background: #0F1B2E;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,0.1);
      transition: all 0.3s;
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(212,175,55,0.15);
    }
    .product-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }
    .product-info {
      padding: 15px;
    }
    .product-name {
      font-size: 17px;
      margin: 0 0 8px 0;
    }
    .price {
      color: #D4AF37;
      font-size: 18px;
      font-weight: 600;
    }
    .promo-price {
      text-decoration: line-through;
      color: #777;
      font-size: 14px;
    }

    .floating-cart {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #D4AF37;
      color: #000;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 25px rgba(212,175,55,0.4);
      z-index: 200;
      cursor: pointer;
    }
    .whatsapp-btn {
      position: fixed;
      bottom: 100px;
      right: 20px;
      background: #25D366;
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
      z-index: 200;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="logo">EU<span class="plus">+</span> <span style="font-size:22px;">Minha Loja +</span></div>
      <input type="text" class="search-bar" placeholder="🔍 Buscar produtos...">
      <div>Virtuosas Brechó +</div>
    </div>
  </header>

  <div class="filters">
    <strong>Filtros:</strong> 
    Feminino • Masculino • Infantil • Calçados • Promoções • Preço: Baixo-Alto
  </div>

  <div class="product-grid">
    <!-- Exemplo de produto -->
    <div class="product-card" onclick="showProductModal()">
      <img src="https://via.placeholder.com/300x300/1a1a1a/fff?text=Bota+Preta" alt="Bota">
      <div class="product-info">
        <h3 class="product-name">Bota Chelsea Preta Salto</h3>
        <p>Tam: 34 | Seminova</p>
        <p class="promo-price">R$ 55,00</p>
        <p class="price">R$ 35,00</p>
        <button onclick="addToCart(event)" style="margin-top:10px; width:100%; padding:10px; background:#D4AF37; border:none; border-radius:8px; color:#000; font-weight:bold;">Adicionar ao Carrinho</button>
      </div>
    </div>

    <!-- Mais cards virão aqui via script -->
  </div>

  <!-- Carrinho Flutuante -->
  <div class="floating-cart" onclick="showCart()">
    🛒 <span id="cart-count" style="position:absolute; top:-8px; right:-8px; background:red; color:white; font-size:14px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;">0</span>
  </div>

  <!-- Botão WhatsApp -->
  <div class="whatsapp-btn" onclick="sendToWhatsApp()">
    📲
  </div>

  <!-- Modal de Produto -->
  <div id="productModal" class="modal">
    <div style="background:#0F1B2E; width:90%; max-width:500px; border-radius:20px; padding:20px;">
      <h2 id="modal-name"></h2>
      <img id="modal-image" style="width:100%; border-radius:12px;">
      <p id="modal-price" style="color:#D4AF37; font-size:24px;"></p>
      <button onclick="addToCartFromModal()" style="width:100%; padding:16px; background:#D4AF37; color:#000; border:none; border-radius:10px; font-weight:bold;">Adicionar ao Carrinho</button>
      <button onclick="closeModal()" style="margin-top:10px; width:100%; padding:14px;">Fechar</button>
    </div>
  </div>

  <script>
    let cart = [];
    function addToCart(e) {
      e.stopImmediatePropagation();
      cart.push({name: "Bota Chelsea Preta", price: 35});
      document.getElementById('cart-count').textContent = cart.length;
      alert("✅ Adicionado ao carrinho!");
    }

    function showCart() {
      alert("🛒 Carrinho (" + cart.length + " itens)\nTotal aproximado: R$ " + (cart.length * 35) + "\n\nBotão para enviar via WhatsApp aparecerá aqui.");
    }

    function sendToWhatsApp() {
      const msg = "Olá! Vi os produtos no Minha Loja + e gostaria de comprar:\n\n" + cart.map(item => `- \( {item.name} - R \) ${item.price}`).join("\n");
      window.open(`https://wa.me/51982264855?text=${encodeURIComponent(msg)}`);
    }

    function showProductModal() {
      document.getElementById('modal-name').textContent = "Bota Chelsea Preta Salto";
      document.getElementById('modal-price').innerHTML = 'R$ 35,00 <span style="font-size:16px; text-decoration:line-through; color:#777;">R$ 55,00</span>';
      document.getElementById('productModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('productModal').style.display = 'none';
    }

    function addToCartFromModal() {
      addToCart({stopImmediatePropagation: () => {}});
      closeModal();
    }
  </script>
</body>
</html>
